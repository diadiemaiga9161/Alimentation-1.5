# ====================================
# APPLICATION CONFIGURATION COMPLETE
# ====================================

# Application
spring.application.name=boutique

# Server
server.port=8080
server.servlet.context-path=/

# ====================================
# DATASOURCE - MySQL
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/alimentation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ====================================
# JPA / HIBERNATE
# ====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# ====================================
# JWT CONFIGURATION
# ====================================
jwt.secret=SecretSuperSecurePourSignatureJWTPourApplicationBoutique2024
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ====================================
# LOGGING
# ====================================
logging.level.com.ges.boutique=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====================================
# CORS
# ====================================
# Ces propriétés sont ignorées si SecurityConfig gère CORS
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# ====================================
# FILE UPLOAD
# ====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====================================
# SWAGGER
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ====================================
# PATH MATCHING - CORRECTION IMPORTANTE
# ====================================
spring.mvc.pathmatch.matching-strategy=ant-path-matcher