# ====================================
# APPLICATION
# ====================================

spring.application.name=boutique-3


# ====================================
# SERVER
# ====================================

server.port=8083
server.servlet.context-path=/

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.forward-headers-strategy=framework


# ====================================
# MYSQL DATABASE - VPS
# ====================================

spring.datasource.url=jdbc:mysql://localhost:3306/alimentation3?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=boutique_user
spring.datasource.password=Boutique@2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ====================================
# HIKARI CONNECTION POOL
# ====================================

spring.datasource.hikari.pool-name=Boutique3HikariPool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ====================================
# JPA / HIBERNATE
# ====================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# ====================================
# JWT CONFIGURATION
# ====================================

jwt.secret=MaigaBoutique3SecretJWTProduction2026ChangeMoiAvantMiseEnLigne
jwt.expiration=86400000
jwt.refresh-expiration=604800000


# ====================================
# LOGGING
# ====================================

logging.level.root=INFO
logging.level.com.ges.boutique=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

logging.file.name=logs/boutique-3.log


# ====================================
# CORS
# ====================================

cors.allowed-origins=http://localhost:4200,http://localhost:8083,http://213.156.134.139,http://213.156.134.139:8083,http://213.156.134.139:82
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.allow-credentials=true


# ====================================
# FILE UPLOAD
# ====================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ====================================
# ANGULAR STATIC FILES
# ====================================

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600


# ====================================
# SWAGGER
# ====================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true


# ====================================
# PATH MATCHING
# ====================================

spring.mvc.pathmatch.matching-strategy=ant-path-matcher


# ====================================
# TIMEZONE / JSON
# ====================================

spring.jackson.time-zone=Africa/Abidjan
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss